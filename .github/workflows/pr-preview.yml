name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and Deploy Preview
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Sync build into preview path
        run: |
          PR_PATH="pr-preview/${{ github.event.pull_request.number }}"
          rm -rf "pages/$PR_PATH"
          mkdir -p "pages/$PR_PATH"
          rsync -a site/ "pages/$PR_PATH/"

      - name: Commit and push preview
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "preview: PR #${{ github.event.pull_request.number }} (${{ github.sha }})" || exit 0
          for i in 1 2 3; do
            git push origin gh-pages && break
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done

      - name: Comment preview link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `https://manual.rt-rc.com/pr-preview/${prNumber}/`;
            const marker = '<!-- pr-preview-link -->';
            const body = `${marker}\n📖 Preview deployed: ${url}\n\nUpdates automatically on every push to this PR.`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-preview:
    name: Remove Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Remove preview path
        run: |
          cd pages
          PR_PATH="pr-preview/${{ github.event.pull_request.number }}"
          if [ -d "$PR_PATH" ]; then
            git rm -rf "$PR_PATH" > /dev/null
          fi

      - name: Commit and push cleanup
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "preview: remove PR #${{ github.event.pull_request.number }}" || exit 0
          git push origin gh-pages
