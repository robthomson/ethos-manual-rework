name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # translation-status.md (see hooks/i18n_status.py) needs full
          # history: `git log -- <path>` on a shallow clone only sees
          # commits within the shallow window.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (for scripts/build_pdfs.py)
        run: python -m playwright install --with-deps chromium

      - name: Validate build
        run: mkdocs build --strict

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1

      # This branch is currently the "1.6" version -- when Ethos26 (or
      # whatever comes next) work begins, cut a frozen `1.6` branch from
      # main first, then bump the version string below on main. See
      # docs/en/contributing/versioning.md.
      - name: Deploy version 1.6 with mike
        run: mike deploy --push --update-aliases 1.6 latest

      - name: Set default (root redirect) version
        run: mike set-default --push latest

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      # Crawls the just-deployed 1.6/ build over local HTTP with headless
      # Chromium into pdf-dist/ -- see scripts/build_pdfs.py's docstring for
      # why this runs as a separate, standalone step instead of an mkdocs
      # plugin, and why the PDFs land in a release rather than gh-pages.
      - name: Build PDF manuals
        run: |
          python -m http.server 8000 --directory pages/1.6 &
          server_pid=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/ > /dev/null && break
            sleep 0.5
          done
          python scripts/build_pdfs.py \
            --base-url http://localhost:8000 \
            --out-dir pdf-dist \
            --version 1.6
          kill "$server_pid"

      # One release per revision, tagged pdf-1.6-<short sha> ("pdf-" prefix
      # so it reads as generated collateral rather than a software release;
      # the sha ties a release to the exact commit's docs state and makes
      # every past PDF snapshot a stable, genuinely linkable artifact --
      # unlike the single rolling "pdf-1.6" release this replaces, which got
      # clobbered on every deploy and could never be pointed at reliably).
      # The site's header links to this repo's release list directly (see
      # overrides/partials/header.html), not to a specific release, so
      # there's nothing else to wire up after this -- readers just pick the
      # newest one, which GitHub already surfaces first/as "Latest".
      #
      # Since every push to main re-triggers this, revisions would
      # otherwise accumulate forever (~12 PDFs x ~15-20MB apiece, every
      # deploy). KEEP_REVISIONS below prunes whole old releases (not
      # individual assets -- each release here is self-contained) once
      # there are more than that many.
      - name: Publish PDF manuals as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP_REVISIONS=10

          sha_short="${GITHUB_SHA:0:7}"
          tag="pdf-1.6-${sha_short}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Re-running the workflow (workflow_dispatch) against a commit
            # already published -- replace this revision's assets in place
            # rather than failing on a duplicate tag.
            gh release upload "$tag" pdf-dist/*.pdf --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Ethos Manual 1.6 -- PDF exports (${sha_short})" \
              --notes "Auto-generated PDF exports of https://manual.rt-rc.com/latest/ as of commit ${GITHUB_SHA}, one per fully-translated locale."
            gh release upload "$tag" pdf-dist/*.pdf --repo "$GITHUB_REPOSITORY"
          fi

          mapfile -t stale_tags < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
              --jq --arg keep "$KEEP_REVISIONS" \
              '[.[] | select(.tagName | startswith("pdf-1.6-"))] | sort_by(.createdAt) | reverse | .[($keep | tonumber):] | .[].tagName'
          )
          for old_tag in "${stale_tags[@]}"; do
            echo "pruning old PDF revision: $old_tag"
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          done

      - name: Ensure custom domain is set
        run: |
          cd pages
          echo "manual.rt-rc.com" > CNAME
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CNAME
          git diff --cached --quiet || git commit -m "chore: set custom domain"
          git push origin gh-pages
