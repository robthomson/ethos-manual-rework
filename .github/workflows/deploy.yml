name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # translation-status.md (see hooks/i18n_status.py) needs full
          # history: `git log -- <path>` on a shallow clone only sees
          # commits within the shallow window.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (for scripts/build_pdfs.py)
        run: python -m playwright install --with-deps chromium

      - name: Validate build
        run: mkdocs build --strict

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1

      # This branch is currently the "1.6" version -- when Ethos26 (or
      # whatever comes next) work begins, cut a frozen `1.6` branch from
      # main first, then bump the version string below on main. See
      # docs/en/contributing/versioning.md.
      - name: Deploy version 1.6 with mike
        run: mike deploy --push --update-aliases 1.6 latest

      - name: Set default (root redirect) version
        run: mike set-default --push latest

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      # Crawls the just-deployed 1.6/ build over local HTTP with headless
      # Chromium into pdf-dist/ -- see scripts/build_pdfs.py's docstring for
      # why this runs as a separate, standalone step instead of an mkdocs
      # plugin, and why the PDFs land in a release rather than gh-pages.
      - name: Build PDF manuals
        run: |
          python -m http.server 8000 --directory pages/1.6 &
          server_pid=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/ > /dev/null && break
            sleep 0.5
          done
          python scripts/build_pdfs.py \
            --base-url http://localhost:8000 \
            --out-dir pdf-dist \
            --version 1.6
          kill "$server_pid"

      # Same tag as the mike version this build corresponds to, "pdf-"
      # prefixed so it reads as generated collateral rather than a software
      # release. Uploading with --clobber replaces this release's assets in
      # place on every deploy, rather than accumulating a new copy in git
      # history the way committing them to gh-pages would. The site's
      # header links to this repo's release list directly (see
      # overrides/partials/header.html), not to a specific asset, so
      # there's nothing else to wire up after this.
      - name: Publish PDF manuals as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pdf-1.6"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Ethos Manual 1.6 -- PDF exports" \
              --notes "Auto-generated PDF exports of https://manual.rt-rc.com/latest/, one per fully-translated locale. Replaced on every deploy -- not meant to be linked to directly by tag/version."

          # --clobber below only overwrites assets whose name matches one
          # we're about to upload -- it never removes one that isn't. That
          # leaves stale PDFs behind after a filename-scheme change, or
          # after a locale drops out of fully_covered_locales() (e.g. a new
          # English page lands untranslated). Prune anything not in this
          # deploy's output first so the release always reflects exactly
          # today's build, never a superset of it.
          mapfile -t current_assets < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          mapfile -t new_assets < <(cd pdf-dist && ls *.pdf)
          for asset in "${current_assets[@]}"; do
            if ! printf '%s\n' "${new_assets[@]}" | grep -qxF "$asset"; then
              echo "removing stale asset: $asset"
              gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" -y
            fi
          done

          gh release upload "$tag" pdf-dist/*.pdf --repo "$GITHUB_REPOSITORY" --clobber

      - name: Ensure custom domain is set
        run: |
          cd pages
          echo "manual.rt-rc.com" > CNAME
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CNAME
          git diff --cached --quiet || git commit -m "chore: set custom domain"
          git push origin gh-pages
