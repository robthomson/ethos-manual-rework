name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # translation-status.md (see hooks/i18n_status.py) needs full
          # history: `git log -- <path>` on a shallow clone only sees
          # commits within the shallow window.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (for scripts/build_pdfs.py)
        run: python -m playwright install --with-deps chromium

      # pandoc + xelatex, for scripts/build_pdf_latex.py -- the PDF pipeline
      # locales in hooks/_locales.py's PDF_LATEX_LOCALES use instead of the
      # Playwright one above (French, initially). texlive-latex-extra
      # provides tcolorbox (admonition boxes) and ucharclasses (per-script
      # font fallback -- see book_metadata()'s docstring), texlive-lang-
      # french the French hyphenation patterns. fonts-noto is the mainfont
      # (book_metadata() sets mainfont: "Noto Sans") plus its Hebrew
      # fallback; fonts-noto-cjk and fonts-dejavu-core are listed
      # separately because they're each needed for exactly one of
      # book_metadata()'s other fallback fonts and aren't guaranteed
      # pulled in by fonts-noto alone on every Ubuntu version.
      - name: Install pandoc and TeX Live (for scripts/build_pdf_latex.py)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-extra texlive-fonts-extra \
            texlive-lang-french fonts-noto fonts-noto-cjk fonts-dejavu-core

      - name: Validate build
        run: mkdocs build --strict

      # Reads docs/<locale>/**/*.md straight from this checkout -- unlike
      # the Playwright pipeline below, it needs no built site and no local
      # HTTP server, so it runs standalone, this early, order-independent
      # relative to the mike/gh-pages steps that follow (writes into the
      # same pdf-dist/ the Playwright step below also writes into, under
      # its own per-locale filenames -- see both scripts' docstrings).
      - name: Build LaTeX PDF manuals
        run: python scripts/build_pdf_latex.py --out-dir pdf-dist --version 26.1

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1

      # This branch tracks the "26.1" version (Ethos26) -- 1.6 was frozen
      # to its own branch when this version's work began. See
      # docs/en/contributing/versioning.md.
      - name: Deploy version 26.1 with mike
        run: mike deploy --push --update-aliases 26.1 latest

      - name: Set default (root redirect) version
        run: mike set-default --push latest

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      # Crawls the just-deployed 26.1/ build over local HTTP with headless
      # Chromium into pdf-dist/ -- see scripts/build_pdfs.py's docstring for
      # why this runs as a separate, standalone step instead of an mkdocs
      # plugin, and why the PDFs land in a release rather than gh-pages.
      # Covers every locale *not* on the LaTeX pipeline above (which already
      # wrote its own locales' PDFs into pdf-dist/ earlier in this job).
      - name: Build PDF manuals (Playwright)
        run: |
          python -m http.server 8000 --directory pages/26.1 &
          server_pid=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/ > /dev/null && break
            sleep 0.5
          done
          python scripts/build_pdfs.py \
            --base-url http://localhost:8000 \
            --out-dir pdf-dist \
            --version 26.1
          kill "$server_pid"

      # One release per revision, tagged pdf-26.1.<run number> ("pdf-"
      # prefix so it reads as generated collateral rather than a software
      # release). github.run_number is this workflow's own strictly-
      # incrementing, built-in counter -- unique per run, never reused, no
      # extra state to track.
      #
      # Deliberately NOT the commit sha (kept in the title/notes below
      # instead): GitHub's releases list -- both the API's default order and
      # the actual /releases page -- sorts version-aware when it can parse a
      # tag as semver, and falls back to plain (ascending/oldest-first!)
      # order when it can't. A hex sha suffix isn't semver-parseable, which
      # made the release list render oldest-first regardless of any sort
      # param passed; a dotted numeric run number is, and sorts correctly.
      #
      # The site's header links to this repo's release list directly (see
      # overrides/partials/header.html), not to a specific release, so
      # there's nothing else to wire up after this -- readers just pick the
      # newest one, which GitHub already surfaces first/as "Latest".
      #
      # Since every push to main re-triggers this, revisions would
      # otherwise accumulate forever (~12 PDFs x ~15-20MB apiece, every
      # deploy). KEEP_REVISIONS below prunes whole old releases (not
      # individual assets -- each release here is self-contained) once
      # there are more than that many.
      - name: Publish PDF manuals as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          KEEP_REVISIONS=10

          sha_short="${GITHUB_SHA:0:7}"
          tag="pdf-26.1.${RUN_NUMBER}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Re-running the workflow (workflow_dispatch) against a commit
            # already published -- replace this revision's assets in place
            # rather than failing on a duplicate tag.
            gh release upload "$tag" pdf-dist/*.pdf --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Ethos Manual 26.1 -- PDF exports (rev ${RUN_NUMBER}, ${sha_short})" \
              --notes "Auto-generated PDF exports of https://manual.rt-rc.com/latest/ as of commit ${GITHUB_SHA}, one per fully-translated locale."
            gh release upload "$tag" pdf-dist/*.pdf --repo "$GITHUB_REPOSITORY"
          fi

          # gh's --jq takes exactly one jq-program argument -- it's not the
          # real `jq` CLI, so it doesn't understand a separate --arg flag.
          # $KEEP_REVISIONS is our own fixed integer (not user input), so
          # interpolating it straight into the filter is safe.
          mapfile -t stale_tags < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
              --jq "[.[] | select(.tagName | startswith(\"pdf-26.1.\"))] | sort_by(.createdAt) | reverse | .[${KEEP_REVISIONS}:] | .[].tagName"
          )
          for old_tag in "${stale_tags[@]}"; do
            echo "pruning old PDF revision: $old_tag"
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          done

      - name: Ensure custom domain is set
        run: |
          cd pages
          echo "manual.rt-rc.com" > CNAME
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CNAME
          git diff --cached --quiet || git commit -m "chore: set custom domain"
          git push origin gh-pages
