name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # translation-status.md (see hooks/i18n_status.py) needs full
          # history: `git log -- <path>` on a shallow clone only sees
          # commits within the shallow window.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate build
        run: mkdocs build --strict

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1

      # This branch is currently the "1.6" version -- when Ethos26 (or
      # whatever comes next) work begins, cut a frozen `1.6` branch from
      # main first, then bump the version string below on main. See
      # docs/en/contributing/versioning.md.
      - name: Deploy version 1.6 with mike
        run: mike deploy --push --update-aliases 1.6 latest

      - name: Set default (root redirect) version
        run: mike set-default --push latest

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Ensure custom domain is set
        run: |
          cd pages
          echo "manual.rt-rc.com" > CNAME
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CNAME
          git diff --cached --quiet || git commit -m "chore: set custom domain"
          git push origin gh-pages
