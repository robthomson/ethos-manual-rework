name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # translation-status.md (see hooks/i18n_status.py) needs full
          # history: `git log -- <path>` on a shallow clone only sees
          # commits within the shallow window.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (for scripts/build_pdfs.py)
        run: python -m playwright install --with-deps chromium

      - name: Validate build
        run: mkdocs build --strict

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1

      # This branch is currently the "1.6" version -- when Ethos26 (or
      # whatever comes next) work begins, cut a frozen `1.6` branch from
      # main first, then bump the version string below on main. See
      # docs/en/contributing/versioning.md.
      - name: Deploy version 1.6 with mike
        run: mike deploy --push --update-aliases 1.6 latest

      - name: Set default (root redirect) version
        run: mike set-default --push latest

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      # Crawls the just-deployed 1.6/ build over local HTTP with headless
      # Chromium and writes ethos-manual.pdf straight into it -- see
      # scripts/build_pdfs.py's docstring for why this runs as a separate,
      # standalone step instead of an mkdocs plugin.
      - name: Build PDF manuals
        run: |
          python -m http.server 8000 --directory pages/1.6 &
          server_pid=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/ > /dev/null && break
            sleep 0.5
          done
          python scripts/build_pdfs.py \
            --base-url http://localhost:8000 \
            --out-dir pages/1.6 \
            --version 1.6
          kill "$server_pid"

      - name: Commit generated assets (CNAME, PDF manuals)
        run: |
          cd pages
          echo "manual.rt-rc.com" > CNAME
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: set custom domain, update PDF manuals"
          git push origin gh-pages
