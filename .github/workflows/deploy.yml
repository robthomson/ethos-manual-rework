name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Add custom domain
        run: echo "manual.rt-rc.com" > site/CNAME

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Sync build into gh-pages root
        run: |
          # Replace everything at the gh-pages root with the new build,
          # except pr-preview/ -- those are separate deploys (see
          # pr-preview.yml) and must survive a main-branch deploy.
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'pr-preview' \
            site/ pages/

      - name: Commit and push
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}" || exit 0
          git push origin gh-pages
