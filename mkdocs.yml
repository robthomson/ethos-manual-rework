      - X18S: radio-notes/x18s.md
      - X20 Pro / X20 Pro AW: radio-notes/x20-pro-and-aw.md
  - Ethos Suite:
      - ethos-suite/index.md
      - Migration: ethos-suite/migration.md
      - Operation: ethos-suite/operation.md
  - Reference:
