site_name: Ethos Manual
site_description: User manual for the FrSky Ethos radio firmware
site_url: https://manual.rt-rc.com/
repo_url: https://github.com/robthomson/ethos-manual-rework
repo_name: ethos-manual-rework
edit_uri: edit/main/docs/
docs_dir: docs

hooks:
  - hooks/i18n_status.py
  - hooks/split_search_index.py

theme:
  name: material
  # overrides/main.html injects locale-scope.js *before* Material's own
  # bundle.js -- see that file for why (extra_javascript renders after
  # bundle.js, too late to intercept the search index request it fires).
  custom_dir: overrides
  logo: assets/ethos-logo-reversed.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
