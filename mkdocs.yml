  # nav_translations: above, unaffected. Must be the *last* plugin here:
  # placing it before i18n breaks with "the literate-nav plugin created
  # the nav based on files that were subsequently modified by another
  # plugin" (confirmed live -- see scripts/_nav.py's own comment).
  - literate-nav

extra:
  version:
    provider: mike
  # Locales with real, .odt-sourced manual content (see
  # ethos-tools/manual-sync) -- de/it/es stay configured below (their
  # real source is PDF-only on this branch, not yet convertible -- see
  # ethos-tools/manual-sync/RUNBOOK.md) but aren't real content yet, so
  # they're deliberately left out of this list until that changes.
  # Read by ethos-manual-rework-editor to filter its Language dropdown
  # down to locales actually worth editing right now; add a locale here
  # the same sync_mapped.py run that gives it real content for the
  # first time.
  real_content_locales:
    - en

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

