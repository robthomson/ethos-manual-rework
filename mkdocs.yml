site_name: Ethos Manual
site_description: User manual for the FrSky Ethos radio firmware
site_url: https://manual.rt-rc.com/
repo_url: https://github.com/robthomson/ethos-manual-rework
repo_name: ethos-manual-rework
edit_uri: edit/main/docs/
docs_dir: docs

hooks:
  - hooks/i18n_status.py

theme:
  name: material
  logo: assets/ethos-logo-reversed.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: de
          name: Deutsch
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            # Section tabs and explicit `Label: path` entries in nav: below
            # don't pick up a locale's page-title translation automatically
            # (mkdocs-static-i18n only does that for nav entries with no
            # explicit label, e.g. `- how-to/index.md`) -- these have to be
            # listed here. Values below are lifted verbatim from each
            # translated page's own H1 (docs/fr/<path>) so the sidebar
            # label matches the page heading exactly; section-tab labels
            # (Home, Getting Started, ...) use the terms established in
            # docs/en/contributing/index.md's translation glossary. Added
            # once French reached full page coverage -- see
            # docs/en/contributing/index.md#nav-labels-nav_translations.
            Home: Accueil
            Getting Started: Prise en main
            Main Views: Vues principales
            User Interface & Navigation: Interface utilisateur et navigation
            USB Connection Modes: Modes de connexion USB
            Emergency Mode: "Mode d'urgence"
            System Setup: Configuration du système
            File Manager: Gestionnaire de fichiers
            Alerts: Alertes
            Date & Time: Date et heure
            General: Général
            Battery: Batterie
            Hardware: Matériel
            Controls: Commandes
            Devices: Périphériques
            Information: Informations
            Model Setup: Configuration du modèle
            Model Select: Choix du modèle
            Model Edit: Modification du modèle
            Flight Modes: Phases de vol
            Mixes: Mixages
            Outputs: Sorties
            Timers: Chronos
            Trims: Trims
            RF System: Système RF
            Curves: Courbes
            Logical Switches: Interrupteurs logiques
            Special Functions: Fonctions spéciales
            Variables: Variables
            Trainer: Écolage
            Telemetry: Télémétrie
            Checklist: Liste de vérification
            Lua Scripts (Model): Scripts Lua (modèle)
            Displays: Écrans
            Additional Displays: Écrans supplémentaires
            Custom Widgets: Widgets personnalisés
            Lua Scripts: Scripts Lua
            Lua Interpreter: Interpréteur Lua
            Ethos Lua Documentation: Documentation Lua d'Ethos
            Example Script Locations: Emplacement des scripts d'exemple
            Configuration Limits: Limites de configuration
            Basic Widget Layout: Structure de base d'un widget
            Tutorials: Tutoriels
            Initial Radio Setup: Configuration initiale de la radio
            Basic Fixed-Wing Example: Exemple de base pour aile fixe
            Basic Flying-Wing (Elevon) Example: "Exemple de base : aile volante (elevons)"
            Basic Flybarless Heli Example: Exemple de base d'hélicoptère flybarless
            How-To Guides: Guides pratiques
            Low Battery Voltage Warning: Alerte de tension batterie basse
            Battery Capacity Warning: Alerte de capacité batterie
            SR8/SR10 Setup: Configuration du modèle SR8/SR10 et réorganisation des voies
            Butterfly (Crocodile) Mixer: Mixage Butterfly (Crocodile)
            Configure an FBUS System: Configurer un système FBUS
            Test a Redundant Receiver: Tester une configuration à récepteur redondant
            User Defined Text Checklist: Liste de vérification à texte personnalisé
            In-Flight Adjustable Compensation Curve: Courbe de compensation ajustable en vol
            Instant Take-Back (Trainer): Reprise instantanée du contrôle pour la fonction écolage
            Find the Latest Bootloader: Trouver le dernier bootloader ou autre composant
            Radio Notes: Notes sur les radios
            X18S: X18S
            X20 Pro / X20 Pro AW: X20 Pro / X20 Pro AW
            Ethos Suite: Suite Ethos
            Migration: Migration
            Operation: Utilisation
            Reference: Référence
            Toolbars: Barres d'outils
            Contributing: Contribuer
            Screenshot Pipeline: Chaîne de production des captures d'écran
            Versioning: Gestion des versions
            # Translation Status intentionally omitted -- it's a generated,
            # English-only maintainer page (hooks/i18n_status.py), no
            # French content exists or is planned for it.

extra:
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Main Views: getting-started/main-views.md
      - User Interface & Navigation: getting-started/user-interface-and-navigation.md
      - USB Connection Modes: getting-started/usb-connection-modes.md
      - Emergency Mode: getting-started/emergency-mode.md
  - System Setup:
      - system-setup/index.md
      - File Manager: system-setup/file-manager.md
      - Alerts: system-setup/alerts.md
      - Date & Time: system-setup/date-and-time.md
      - General: system-setup/general.md
      - Battery: system-setup/battery.md
      - Hardware: system-setup/hardware.md
      - Controls: system-setup/controls.md
      - Devices: system-setup/devices.md
      - Information: system-setup/information.md
  - Model Setup:
      - model-setup/index.md
      - Model Select: model-setup/model-select.md
      - Model Edit: model-setup/model-edit.md
      - Flight Modes: model-setup/flight-modes.md
      - Mixes: model-setup/mixes.md
      - Outputs: model-setup/outputs.md
      - Timers: model-setup/timers.md
      - Trims: model-setup/trims.md
      - RF System: model-setup/rf-system.md
      - Curves: model-setup/curves.md
      - Logical Switches: model-setup/logical-switches.md
      - Special Functions: model-setup/special-functions.md
      - Variables: model-setup/variables.md
      - Trainer: model-setup/trainer.md
      - Telemetry: model-setup/telemetry.md
      - Checklist: model-setup/checklist.md
      - Lua Scripts (Model): model-setup/lua-scripts.md
  - Displays:
      - displays/index.md
      - Additional Displays: displays/additional-displays.md
      - Custom Widgets: displays/custom-widgets.md
  - Lua Scripts:
      - lua-scripts/index.md
      - Lua Interpreter: lua-scripts/lua-interpreter.md
      - Ethos Lua Documentation: lua-scripts/ethos-lua-documentation.md
      - Example Script Locations: lua-scripts/example-script-locations.md
      - Configuration Limits: lua-scripts/configuration-limits.md
      - Basic Widget Layout: lua-scripts/basic-widget-layout.md
  - Tutorials:
      - tutorials/index.md
      - Initial Radio Setup: tutorials/initial-radio-setup.md
      - Basic Fixed-Wing Example: tutorials/basic-fixed-wing.md
      - Basic Flying-Wing (Elevon) Example: tutorials/basic-flying-wing.md
      - Basic Flybarless Heli Example: tutorials/basic-flybarless-heli.md
  - How-To Guides:
      - how-to/index.md
      - Low Battery Voltage Warning: how-to/low-battery-warning.md
      - Battery Capacity Warning: how-to/battery-capacity-warning.md
      - SR8/SR10 Setup: how-to/sr8-sr10-setup.md
      - Butterfly (Crocodile) Mixer: how-to/butterfly-mixer.md
      - Configure an FBUS System: how-to/fbus-setup.md
      - Test a Redundant Receiver: how-to/test-redundant-receiver.md
