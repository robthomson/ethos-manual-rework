site_name: Ethos Manual
site_description: User manual for the FrSky Ethos radio firmware
site_url: https://manual.rt-rc.com/
repo_url: https://github.com/robthomson/ethos-manual-rework
repo_name: ethos-manual-rework
edit_uri: edit/main/docs/
docs_dir: docs

hooks:
  - hooks/i18n_status.py
  - hooks/split_search_index.py

theme:
  name: material
  # overrides/main.html injects locale-scope.js *before* Material's own
  # bundle.js -- see that file for why (extra_javascript renders after
  # bundle.js, too late to intercept the search index request it fires).
  custom_dir: overrides
  logo: assets/ethos-logo-reversed.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
  # Nav structure/titles come from docs/en/SUMMARY.md instead of a nav:
  # block below -- per-locale titles still come from each locale's own
  # nav_translations: above, unaffected. Must be the *last* plugin here:
  # placing it before i18n breaks with "the literate-nav plugin created
  # the nav based on files that were subsequently modified by another
  # plugin" (confirmed live -- see scripts/_nav.py's own comment).
  - literate-nav

extra:
  version:
    provider: mike
  # Locales with real, .odt-sourced manual content (see
  # ethos-tools/manual-sync). English only on this branch for now --
  # de/it/es were removed from plugins.i18n.languages below entirely
  # (their real source is PDF-only here, not yet convertible -- see
  # ethos-tools/manual-sync/RUNBOOK.md's "PDF-only locales" section for
  # why), rather than left configured-but-fake. Add a locale back to
  # both plugins.i18n.languages and here together, the same
  # sync_mapped.py run that gives it real content for the first time.
  real_content_locales:
    - en

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

